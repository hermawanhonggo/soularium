<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Soularium — Latihan refleksi visual. Jawab 5 pertanyaan dengan memilih dari 8 gambar.">
  <title>Soularium — Refleksi Visual</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header id="app-header">
    <h1 id="app-title">Soularium</h1>
    <p id="app-subtitle">Pilih gambar yang paling menggambarkan jawaban Anda.</p>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="app-main">

    <!-- QUESTION VIEW -->
    <section id="question-view" aria-label="Pertanyaan">

      <!-- Progress -->
      <div id="progress-area">
        <p id="progress-label">Pertanyaan 1 dari 5</p>
        <div id="progress-dots" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="5">
          <span class="dot filled" aria-hidden="true"></span>
          <span class="dot" aria-hidden="true"></span>
          <span class="dot" aria-hidden="true"></span>
          <span class="dot" aria-hidden="true"></span>
          <span class="dot" aria-hidden="true"></span>
        </div>
      </div>

      <!-- Question text -->
      <h2 id="question-text"></h2>

      <!-- Image grid -->
      <div id="image-grid" role="radiogroup" aria-label="Pilihan gambar">
        <!-- Cards generated by JS -->
      </div>

      <!-- Navigation -->
      <div id="nav-area">
        <button id="btn-back" hidden aria-label="Kembali ke pertanyaan sebelumnya">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          Kembali
        </button>
      </div>

    </section>

    <!-- RESULT VIEW -->
    <section id="result-view" aria-label="Hasil" hidden>

      <h2 id="result-title">Hasil Pilihan Anda</h2>

      <div id="result-cards">
        <!-- Generated by JS -->
      </div>

      <div id="result-narrative">
        <h3>Profil Refleksi Anda</h3>
        <p id="narrative-text"></p>
      </div>

      <div id="result-nav">
        <button id="btn-restart" aria-label="Mulai ulang latihan">Mulai Ulang</button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
